<style>
:root{--bg:#0b0b14;--card:#14141f;--tx:#eceaf5;--mut:#8b89a0;--ac:#a855f7;--bd:#262638;--pc:#22d3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f1fa;--card:#fff;--tx:#1c1b2a;--mut:#6b6a80;--bd:#ddd9ee}}
:root[data-theme="dark"]{--bg:#0b0b14;--card:#14141f;--tx:#eceaf5;--mut:#8b89a0;--bd:#262638}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:var(--pc);opacity:calc(var(--pu,0)*.14)}
.w{max-width:880px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
#drop{border:2px dashed var(--bd);text-align:center;cursor:pointer;color:var(--mut)}
#drop.on{border-color:var(--ac);color:var(--tx)}
canvas{width:100%;height:280px;display:block;border-radius:12px;background:#07070d}
#vz:fullscreen{padding:0;border:0;border-radius:0}#vz:fullscreen canvas{height:100vh;border-radius:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
button,select{background:var(--bd);color:var(--tx);border:0;border-radius:10px;padding:9px 13px;font-size:14px;cursor:pointer}

input[type=range]{flex:1;min-width:80px;accent-color:var(--ac)}

label.ch{background:var(--bd);color:var(--tx);padding:8px 13px;border-radius:20px;cursor:pointer;font-size:14px}
label.ch:has(input:checked){background:var(--ac);color:#fff}label.ch input{display:none}
.t{font-size:13px;color:var(--mut);min-width:84px;text-align:center}
#pl{display:flex;flex-direction:column;gap:4px;max-height:130px;overflow:auto;margin-top:8px}
#pl button{text-align:left;padding:6px 10px;font-size:13px}
#st{font-size:13px;color:var(--mut);min-height:18px}
body{min-height:100dvh;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}

@media(min-width:960px){.w{max-width:1040px}canvas{height:380px}}
@media(max-width:640px){.w{padding:10px}h1{font-size:19px}canvas{height:210px}.card{padding:11px;border-radius:14px}
button,select,label.ch{min-height:42px}.row{gap:8px}#fx label:not(.ch){flex:1 1 44%}.t{min-width:70px}#sk{order:5;flex:1 1 100%}input[type=range]{height:28px}}
@media(max-height:480px) and (orientation:landscape){canvas{height:55vh}}
</style></head><body><div class="w">
<h1>🎧 Music Vibe Lab</h1>
<div class="card" id="drop"><div style="color:var(--mut)">🎵 Musiqa(lar)ni shu yerga tashla yoki bosib tanla</div><div id="fn" style="margin-top:6px;color:var(--tx)"></div>
<input id="f" type="file" accept="audio/*,.m4a" multiple hidden></div>
<div class="card" id="vz"><canvas id="cv"></canvas></div>

<div class="card">
<div class="row"><button id="pv">⏮</button><button id="pp" disabled>▶ Play</button><button id="nx">⏭</button>
<input id="sk" type="range" min="0" max="1000" value="0"><span class="t" id="tm">0:00 / 0:00</span></div>
<div class="row"><label>🔊<input id="vol" type="range" min="0" max="1" step=".01" value=".8"></label>
<label class="ch"><input type="checkbox" id="lp">🔁 Loop</label><button id="ba">A</button><button id="bb">B</button><button id="bx">✕</button>
<span class="t" id="bpm"></span></div><div id="pl"></div></div>

<div class="card" id="fx">
<div class="row">
<label class="ch"><input type="checkbox" id="kar">🎤 Karaoke</label>
<label class="ch"><input type="checkbox" id="bas">Bass boost</label>
<label class="ch"><input type="checkbox" id="eq8">Equalizer</label>

<label class="ch"><input type="checkbox" id="ech">Echo</label>

<label>Echo vaqti<input id="et" type="range" min=".1" max="1" step=".01" value=".38"></label>

<div class="row">

<label>4k<input class="eq" id="e3" type="range" min="-12" max="12" value="0"></label>

<select id="sty"><option value="bar">Ustun</option><option value="mir">Ko'zgu</option><option value="rad">Doira</option><option value="wave">To'lqin</option></select></div>

<div class="row"><label>⬅️➡️ Fon joyi<input type="range" id="bgpx" min="-100" max="100" value="0"></label><label>⬆️⬇️ Fon joyi<input type="range" id="bgpy" min="-100" max="100" value="0"></label></div></div>
</div>
<div style="text-align:center;color:var(--mut);font-size:12px;margin:18px 0 6px">Powered by: <a href="https://t.me/LaborantRobot" style="color:var(--ac);text-decoration:none">@LaborantRobot</a> on telegram</div>
<script>
const $=id=>document.getElementById(id),V=id=>+$(id).value,C=id=>$(id).checked,audio=new Audio();
let ctx,src,an,vol,made=[],file=null,list=[],cur=-1,dec,url,A=0,Bp=0,ab=false,seeking=false;
const st=t=>$('st').textContent=t||'',fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00',sp=()=>C('slo')?.8:C('nig')?1.25:1;

// ---- effekt zanjiri (jonli ham, yuklab olish ham shuni ishlatadi)
function ir(c){if(c._ir)return c._ir;const l=c.sampleRate*2.8|0,b=c.createBuffer(2,l,c.sampleRate);
  for(let h=0;h<2;h++){const d=b.getChannelData(h);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,3)}return c._ir=b}
function build(c,inp,out){
  const n=[];let x=inp;const add=a=>{x.connect(a);x=a;n.push(a);return a};
  if(C('kar')){const s=c.createChannelSplitter(2),iv=c.createGain(),m=c.createChannelMerger(2);iv.gain.value=-1;
    x.connect(s);s.connect(m,0,0);s.connect(m,0,1);s.connect(iv,1);iv.connect(m,0,0);iv.connect(m,0,1);n.push(s,iv,m);x=m}
  if(C('bas')){const f=c.createBiquadFilter();f.type='lowshelf';f.frequency.value=140;f.gain.value=V('bg');add(f)}
  if(C('eq8'))[60,250,1000,4000,12000].forEach((fr,i)=>{const q=c.createBiquadFilter();q.type=i?i<4?'peaking':'highshelf':'lowshelf';q.frequency.value=fr;q.gain.value=V('e'+i);add(q)});
  if(C('d8')){const p=c.createStereoPanner(),o=c.createOscillator();o.frequency.value=V('ds');o.connect(p.pan);o.start();add(p);n.push(o)}
  if(C('ech')){const s=x,d=c.createDelay(2),fb=c.createGain(),w=c.createGain(),o=c.createGain();d.delayTime.value=V('et');fb.gain.value=.45;w.gain.value=.55;
    s.connect(o);s.connect(d);d.connect(w);d.connect(fb);fb.connect(d);w.connect(o);n.push(d,fb,w,o);x=o}
  if(C('rev')){const s=x,cv=c.createConvolver(),w=c.createGain(),dr=c.createGain(),o=c.createGain(),m=V('rm');cv.buffer=ir(c);w.gain.value=m*1.5;dr.gain.value=1-m*.5;
    s.connect(dr);s.connect(cv);cv.connect(w);dr.connect(o);w.connect(o);n.push(cv,w,dr,o);x=o}
  if(C('bas')||C('eq8')){const l=c.createDynamicsCompressor();l.threshold.value=-8;l.ratio.value=12;l.knee.value=0;add(l)}
  x.connect(out);return n;
}
function init(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  src=ctx.createMediaElementSource(audio);an=ctx.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=.6;
  vol=ctx.createGain();vol.gain.value=$('vol').value;an.connect(vol);vol.connect(ctx.destination);route()}
function route(){if(!ctx)return;src.disconnect();made.forEach(n=>{try{n.stop&&n.stop();n.disconnect()}catch(e){}});
  made=build(ctx,src,an);audio.playbackRate=sp();audio.preservesPitch=audio.mozPreservesPitch=audio.webkitPreservesPitch=false}

// ---- playlist
function add(fs){[...fs].filter(f=>f.type.startsWith('audio')||/\.(m4a|mp3|wav|ogg|flac|aac)$/i.test(f.name)).forEach(f=>list.push(f));
  if(!list.length)return st('Audio fayl tanlang.');const first=cur<0;pl();if(first)play(0)}
function pl(){const p=$('pl');p.textContent='';if(list.length<2)return;
  list.forEach((f,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+f.name;if(i==cur)b.className='act';b.onclick=()=>play(i);p.append(b)})}
function play(i){cur=i;file=list[i];if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);audio.src=url;audio.loop=C('lp');
  $('fn').textContent=file.name;$('pp').disabled=$('dl').disabled=false;init();ctx.resume();audio.play();ms();A=Bp=0;ab=false;pl();$('bpm').textContent='BPM ...';
  dec=file.arrayBuffer().then(a=>ctx.decodeAudioData(a));dec.then(bpm).catch(()=>$('bpm').textContent='')}
$('drop').onclick=()=>$('f').click();$('f').onchange=e=>add(e.target.files);
['dragover','dragenter'].forEach(e=>$('drop').addEventListener(e,ev=>{ev.preventDefault();$('drop').classList.add('on')}));
['dragleave','drop'].forEach(e=>$('drop').addEventListener(e,ev=>{ev.preventDefault();$('drop').classList.remove('on')}));
$('drop').addEventListener('drop',e=>add(e.dataTransfer.files));
$('pv').onclick=()=>cur>0&&play(cur-1);$('nx').onclick=()=>cur<list.length-1&&play(cur+1);
audio.onended=()=>{if(cur<list.length-1)play(cur+1)};

// ---- player
$('pp').onclick=()=>{init();ctx.resume();audio.paused?audio.play():audio.pause()};
audio.onplay=()=>{$('pp').textContent='⏸ Pause';wl()};audio.onpause=()=>{$('pp').textContent='▶ Play';if(wlk){wlk.release();wlk=null}};
audio.ontimeupdate=()=>{if(!seeking)$('sk').value=audio.duration?audio.currentTime/audio.duration*1000:0;$('tm').textContent=fmt(audio.currentTime)+' / '+fmt(audio.duration)};
$('sk').oninput=e=>{seeking=true;audio.currentTime=e.target.value/1000*audio.duration};$('sk').onchange=()=>seeking=false;
$('vol').oninput=()=>{if(vol)vol.gain.value=$('vol').value};
$('lp').onchange=()=>audio.loop=C('lp');
$('ba').onclick=()=>{A=audio.currentTime;ab=Bp>A;st('A: '+fmt(A))};
$('bb').onclick=()=>{Bp=audio.currentTime;ab=Bp>A;st(ab?'A–B takror: '+fmt(A)+' → '+fmt(Bp):"B nuqta A dan keyin bo'lsin")};
$('bx').onclick=()=>{ab=false;A=Bp=0;st("A–B o'chirildi")};
addEventListener('keydown',e=>{const t=e.target,g=t.tagName;if(g==='SELECT'||(g==='INPUT'&&t.type==='range')||(g==='BUTTON'&&e.code==='Space'))return;
  if(e.code==='Space'){e.preventDefault();$('pp').click()}
  else if(e.code==='ArrowRight')audio.currentTime+=5;else if(e.code==='ArrowLeft')audio.currentTime-=5;
  else if(e.code==='ArrowUp'||e.code==='ArrowDown'){e.preventDefault();$('vol').value=Math.min(1,Math.max(0,V('vol')+(e.code==='ArrowUp'?.05:-.05)));$('vol').oninput()}});

// ---- BPM
async function bpm(){const b=await dec,d=b.getChannelData(0),n=Math.min(d.length,b.sampleRate*90),B=256,e=[];let p=0;
  for(let i=0;i+B<n;i+=B){let s=0;for(let k=0;k<B;k++)s+=d[i+k]*d[i+k];s=Math.sqrt(s/B);e.push(Math.max(0,s-p));p=s}
  const fps=b.sampleRate/B;let best=0,bl=0;
  for(let l=Math.floor(fps*60/180);l<=Math.ceil(fps*60/70);l++){let s=0;for(let i=0;i+l<e.length;i++)s+=e[i]*e[i+l];s/=e.length-l;if(s>best){best=s;bl=l}}
  $('bpm').textContent=bl?'BPM ≈ '+Math.round(fps*60/bl):''}

// ---- effekt boshqaruvi, saqlash
const SEL='#fx input,#fx select,#vs input,#vs select',Q=()=>document.querySelectorAll(SEL);
try{const o=JSON.parse(localStorage.getItem('mv1')||'{}');Q().forEach(e=>{if(e.id in o){e.type==='checkbox'?e.checked=o[e.id]:e.value=o[e.id]}})}catch(e){}
const sv=()=>{try{localStorage.setItem('mv1',JSON.stringify(Object.fromEntries([...Q()].map(e=>[e.id,e.type==='checkbox'?e.checked:e.value]))))}catch(e){}};
$('fx').addEventListener('input',e=>{if(e.target.id==='slo'&&C('slo'))$('nig').checked=false;if(e.target.id==='nig'&&C('nig'))$('slo').checked=false;route()});
['fx','vs'].forEach(i=>$(i).addEventListener('input',sv));
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const[a,c]=b.dataset.p.split(',');$('c1').value=a;$('c2').value=c;$('rb').checked=false;sv()});
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('vz').requestFullscreen&&$('vz').requestFullscreen();
$('cv').ondblclick=$('fs').onclick;

// ---- yuklab olish
function wav(buf){const ch=buf.numberOfChannels,n=buf.length,o=new DataView(new ArrayBuffer(44+n*ch*2)),w=(p,s)=>[...s].forEach((c,i)=>o.setUint8(p+i,c.charCodeAt(0)));
  w(0,'RIFF');o.setUint32(4,36+n*ch*2,true);w(8,'WAVEfmt ');o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,ch,true);o.setUint32(24,buf.sampleRate,true);
  o.setUint32(28,buf.sampleRate*ch*2,true);o.setUint16(32,ch*2,true);o.setUint16(34,16,true);w(36,'data');o.setUint32(40,n*ch*2,true);
  const d=[...Array(ch)].map((_,i)=>buf.getChannelData(i));let p=44;
  for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const s=Math.max(-1,Math.min(1,d[c][i]));o.setInt16(p,s<0?s*32768:s*32767,true);p+=2}
  return new Blob([o],{type:'audio/wav'})}
function mp3(b){const e=new lamejs.Mp3Encoder(2,b.sampleRate,192),I=a=>{const o=new Int16Array(a.length);for(let i=0;i<a.length;i++){const s=Math.max(-1,Math.min(1,a[i]));o[i]=s<0?s*32768:s*32767}return o},
  L=I(b.getChannelData(0)),R=I(b.getChannelData(1)),o=[];
  for(let i=0;i<L.length;i+=1152){const k=e.encodeBuffer(L.subarray(i,i+1152),R.subarray(i,i+1152));if(k.length)o.push(k)}o.push(e.flush());return new Blob(o,{type:'audio/mpeg'})}
const lib=()=>window.lamejs?1:new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js';s.onload=r;s.onerror=j;document.head.appendChild(s)});
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
// ---- Telegram orqali yuborish (mavjud bo'lsa), aks holda/hato bo'lsa brauzerdan yuklab olish
const BOT_API='https://emodzirobot.onrender.com';
async function deliver(blob,name){
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg&&tg.initData){
    try{
      const res=await fetch(BOT_API+'/api/music/upload?filename='+encodeURIComponent(name),{method:'POST',body:blob});
      if(!res.ok)throw new Error('upload '+res.status);
      const j=await res.json();
      if(!j||!j.token)throw new Error('token yo\'q');
      tg.sendData('music:'+j.token);
      return;
    }catch(e){/* Telegram orqali ketmadi — pastda brauzerdan avto yuklab olamiz */}
  }
  save(blob,name);
}
$('dl').onclick=async()=>{
  if(!file)return;const base=file.name.replace(/\.[^.]+$/,'');
  if(!document.querySelector('#fx .ch input:checked'))return deliver(file,file.name);
  $('dl').disabled=true;st('Tayyorlanmoqda...');
  try{const buf=await dec,r=sp(),t=C('ech')||C('rev')?4:0,off=new OfflineAudioContext(2,Math.ceil(buf.length/r)+t*buf.sampleRate,buf.sampleRate),s=off.createBufferSource();
    s.buffer=buf;s.playbackRate.value=r;build(off,s,off.destination);s.start();const o=await off.startRendering();let blob,ext='wav';
    if($('fm').value==='mp3'){try{await lib();blob=mp3(o);ext='mp3'}catch(e){}}
    await deliver(blob||wav(o),base+'_fx.'+ext);st(ext==='mp3'?'Tayyor! ✅':'Tayyor (WAV) ✅')}catch(e){st('Xatolik: '+e.message)}
  $('dl').disabled=false};

// ---- fon rasm (vizualizator orqasida, xiragina ko'rinadi)
let bgImg=null,bgUrl=null;
function setBg(blob){
  if(!blob||!blob.size)return st("Rasm topilmadi.");
  if(bgUrl)URL.revokeObjectURL(bgUrl);
  bgUrl=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{bgImg=img;$('bgx').disabled=false};
  img.onerror=()=>st("Rasmni ochib bo'lmadi.");
  img.src=bgUrl;
}
$('bgup').onclick=()=>$('bgf').click();
$('bgf').onchange=e=>{const f=e.target.files[0];if(f)setBg(f)};
$('bgx').onclick=()=>{bgImg=null;if(bgUrl){URL.revokeObjectURL(bgUrl);bgUrl=null}$('bgx').disabled=true};

// ID3v2 APIC (albom muqovasi) ni audio fayldan ajratib olish — faqat mp3/ID3v2
// uchun ishlaydi; topilmasa, user "🖼 Fon rasm" orqali o'zi tanlashi mumkin.
async function extractThumb(f){
  try{
    const b=new Uint8Array(await f.slice(0,2*1024*1024).arrayBuffer());
    if(b[0]!==0x49||b[1]!==0x44||b[2]!==0x33)return null; // 'ID3'
    const ver=b[3],ss=i=>((b[i]&0x7f)<<21)|((b[i+1]&0x7f)<<14)|((b[i+2]&0x7f)<<7)|(b[i+3]&0x7f);
    const end=10+ss(6);let p=10;
    while(p<end-10){
      const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);
      if(!/^[A-Z0-9]{4}$/.test(id))break;
      const size=ver>=4?ss(p+4):((b[p+4]<<24)|(b[p+5]<<16)|(b[p+6]<<8)|b[p+7]);
      if(!size||size<0||p+10+size>end)break;
      const fs=p+10;
      if(id==='APIC'){
        let q=fs+1,mEnd=q;while(b[mEnd]&&mEnd<fs+size)mEnd++;
        const mime=new TextDecoder().decode(b.slice(q,mEnd))||'image/jpeg';
        q=mEnd+1+1;let dEnd=q;while(b[dEnd]&&dEnd<fs+size)dEnd++;
        q=dEnd+1;
        return new Blob([b.slice(q,fs+size)],{type:mime.startsWith('image')?mime:'image/jpeg'});
      }
      p=fs+size;
    }
  }catch(e){}
  return null;
}

// ---- vizualizatsiya
const cv=$('cv'),g=cv.getContext('2d'),td=new Uint8Array(2048);
let lvl=[],pk=[],pv=[],ceil=-38,bass=0,pb=0,fd=null,pa=[];
const LO=40,HI=14000,RANGE=40;
function draw(){
  requestAnimationFrame(draw);
  const dpr=Math.min(devicePixelRatio||1,2),W=cv.clientWidth*dpr|0,H=cv.clientHeight*dpr|0;
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  if(ab&&audio.currentTime>=Bp)audio.currentTime=A;
  const N=+$('nb').value,sty=$('sty').value,h=performance.now()/30%360,rb=C('rb'),
    k1=rb?`hsl(${h},90%,55%)`:$('c1').value,k2=rb?`hsl(${(h+70)%360},90%,60%)`:$('c2').value;
  document.documentElement.style.setProperty('--pc',k2);document.documentElement.style.setProperty('--pu',C('pu')?bass.toFixed(2):0);
  g.clearRect(0,0,W,H);
  if(bgImg){
    // "cover" kabi: nisbatni buzmasdan butun canvasni to'ldiradi (uzun/qisqa rasm ham avto moslashadi),
    // xiragina (past shaffoflik + biroz loyqa) — audiografika orqasida "hissiy fon" sifatida ko'rinadi
    g.save();g.filter='blur('+(3*dpr)+'px)';g.globalAlpha=.35;
    const ir=bgImg.width/bgImg.height,cr=W/H;let dw,dh,dx,dy;
    if(ir>cr){dh=H;dw=H*ir;dx=(W-dw)/2;dy=0}else{dw=W;dh=W/ir;dx=0;dy=(H-dh)/2}
    // Fonni qo'lda siljitish (chapga/o'ngga, yuqoriga/pastga) — faqat haqiqatda
    // "ortiqcha" (kesilgan) qismi bor tomonda ta'sir qiladi, aks holda 0*narsa=0
    const px=+$('bgpx').value/100,py=+$('bgpy').value/100;
    dx*=(1+px);dy*=(1+py);
    g.drawImage(bgImg,dx,dy,dw,dh);g.restore();
  }
  if(C('pu')){g.fillStyle=k2;g.globalAlpha=bass*.14;g.fillRect(0,0,W,H);g.globalAlpha=1}
  if(lvl.length!==N){lvl=Array(N).fill(0);pk=Array(N).fill(0);pv=Array(N).fill(0)}
  const live=an&&!audio.paused;
  if(live){if(!fd||fd.length!==an.frequencyBinCount)fd=new Float32Array(an.frequencyBinCount);an.getFloatFrequencyData(fd)}
  const hz=live?ctx.sampleRate/an.fftSize:1,r=HI/LO,F=k=>fd[k]>-140?fd[k]:-140,db=new Array(N);let top=-200;
  for(let i=0;i<N;i++){let d=-200;
    if(live){const f1=LO*Math.pow(r,i/N),f2=LO*Math.pow(r,(i+1)/N),a=f1/hz,b=f2/hz;
      if(b-a<1){const p=(a+b)/2,k=p|0,t=p-k;d=F(k)*(1-t)+F(k+1)*t}else for(let k=Math.ceil(a);k<=b;k++){const x=F(k);if(x>d)d=x}
      d+=4*Math.log2(Math.sqrt(f1*f2)/1000)}
    db[i]=d;if(d>top)top=d}
  ceil=top>ceil?ceil+(top-ceil)*.5:ceil-.1;const eff=Math.max(ceil,-38);let bs=0;const nb=Math.max(2,N*.1|0);
  for(let i=0;i<N;i++){let v=Math.max(0,Math.min(1,(db[i]-(eff-RANGE))/RANGE));v=Math.pow(v,1.3);
    lvl[i]+=(v-lvl[i])*(v>lvl[i]?.7:.2);
    if(lvl[i]>=pk[i]){pk[i]=lvl[i];pv[i]=0}else{pv[i]+=.0014;pk[i]=Math.max(0,pk[i]-pv[i])}
    if(i<nb)bs+=lvl[i]}
  bass=bass*.6+(bs/nb)*.4;
  g.shadowColor=k2;g.shadowBlur=C('gl')?(4+bass*26)*dpr:0;
  if(sty==='rad'){
    const cx=W/2,cy=H/2,m=Math.min(W,H),R0=m*.2*(1+bass*.1),L=m*.3,gr=g.createRadialGradient(cx,cy,R0,cx,cy,R0+L);gr.addColorStop(0,k1);gr.addColorStop(1,k2);
    g.strokeStyle=gr;g.lineWidth=Math.max(2,Math.PI*R0/N*.8);g.lineCap='round';const P=new Path2D();
    for(let i=0;i<N;i++){const a=Math.PI*(i+.5)/N,l=3*dpr+lvl[i]*L;for(const s of[1,-1]){const x=Math.sin(a)*s,y=Math.cos(a);P.moveTo(cx+x*R0,cy+y*R0);P.lineTo(cx+x*(R0+l),cy+y*(R0+l))}}
    g.stroke(P);
  }else if(sty==='wave'){
    if(live)an.getByteTimeDomainData(td);const gr=g.createLinearGradient(0,0,W,0);gr.addColorStop(0,k1);gr.addColorStop(1,k2);
    const P=new Path2D(),step=Math.max(1,W/400);
    for(let x=0;x<=W;x+=step){const v=live?(td[Math.min(2047,x/W*2048|0)]-128)/128:0,y=H/2+v*H*.45*(1+bass*.5);x?P.lineTo(x,y):P.moveTo(x,y)}
    g.strokeStyle=gr;g.lineWidth=3*dpr;g.lineJoin='round';g.stroke(P);
  }else{
    const mir=sty==='mir',base=mir?H/2:H,mh=base,bw=W/N,gr=g.createLinearGradient(0,mir?0:H,0,mir?H/2:0);gr.addColorStop(0,k1);gr.addColorStop(1,k2);
    const P=new Path2D(),M=new Path2D(),Cp=new Path2D();
    for(let i=0;i<N;i++){const hh=Math.max(3*dpr,lvl[i]*mh*.96),x=i*bw+bw*.15,w=bw*.7;
      P.rect(x,base-hh,w,hh);if(mir)M.rect(x,base,w,hh);Cp.rect(x,base-pk[i]*mh*.96-4*dpr,w,2.5*dpr)}
    g.fillStyle=gr;g.fill(P);if(mir){g.globalAlpha=.5;g.fill(M);g.globalAlpha=1}
    g.shadowBlur=0;g.fillStyle=k2;g.fill(Cp);
  }
  g.shadowBlur=0;
  if(C('pt')){
    if(bass>.45&&bass-pb>.05&&pa.length<220)for(let i=0;i<10;i++)pa.push({x:Math.random()*W,y:sty==='mir'?H/2:H,vx:(Math.random()-.5)*2*dpr,vy:-(2+Math.random()*4)*dpr,l:1});
    pa=pa.filter(p=>p.l>0);g.fillStyle=k2;
    for(const p of pa){p.x+=p.vx;p.y+=p.vy;p.l-=.012;g.globalAlpha=p.l;g.beginPath();g.arc(p.x,p.y,2.5*dpr*p.l+1,0,7);g.fill()}
    g.globalAlpha=1}else pa=[];
  pb=bass;
}
